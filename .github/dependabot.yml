# Weekly GitHub Actions updates, grouped into one PR.
#
# npm packages are not bumped here. Expo Go on the phone pins SDK 58, and the weekly npm PRs went unmerged (4 opened,
# 0 merged, Oct 29 to Nov 17), so dependencies move together with the SDK: `npx expo install expo@^59 --fix`, then
# `npm test && npm run typecheck && npm run lint`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
